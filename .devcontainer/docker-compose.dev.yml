# Usage: .devcontainer/load-dotenv.sh docker-compose -f .devcontainer/docker-compose.dev.yml up

services:
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "6379:6379"
    command: redis-server --requirepass root
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}


  mysql:
    image: mysql:8.4@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASS}
      MYSQL_DATABASE: ${DB_MYSQL_NAME}
    ports:
      - ${DB_MYSQL_PORT}:3306
    expose:
      - "3306"

  pma:
    image: phpmyadmin@sha256:cb397b351fe66dcdf3676dcec30a0ce2fb0f4ad3b2f63d4897bedd3f3070e06c
    ports:
      - "8090:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_PORT=${DB_MYSQL_PORT}
    depends_on:
      - mysql


volumes:
  db-data:
