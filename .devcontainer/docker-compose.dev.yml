# Usage: .devcontainer/load-dotenv.sh docker-compose -f .devcontainer/docker-compose.dev.yml up

services:
  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "6379:6379"
    command: redis-server --requirepass root
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}


  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_MYSQL_PASS}
      MYSQL_DATABASE: ${DB_MYSQL_NAME}
    ports:
      - ${DB_MYSQL_PORT}:3306
    expose:
      - "3306"

  pma:
    image: phpmyadmin@sha256:ae3d553347a8c5ecde652ab2fef12fbae172150c9b88ca3b4524fb87554a3ba7
    ports:
      - "8090:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_PORT=${DB_MYSQL_PORT}
    depends_on:
      - mysql


volumes:
  db-data:
