name: Open Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  ocr_job:
    if: github.event.label.name == 'review'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open Code Review Action
        uses: alibaba/open-code-review@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_url: "https://opencode.ai/zen/go/v1"
          llm_auth_token: ${{ secrets.OPENCODE_API_KEY }}
          llm_model: "deepseek-v4-flash"
          llm_use_anthropic: "false"
          llm_extra_body: '{"thinking": {"type": "enabled"}, "reasoning_effort": "high"}'
          background: "Ignore all code-style, formatting, or indentation issues (Laravel Pint will catch these)."

      - name: Remove review label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'review'
            });
