name: PR Type + Completeness Labeling

# pull_request_target so fork PRs are labelled too. It holds a write-capable token,
# so never check out the PR head or run project code here — the PR must only ever
# enter as data (pr.diff).
on:
  pull_request_target:
    types: [opened]

concurrency:
  group: pr-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Get PR diff
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Skip large diffs
        id: size_check
        run: |
          size=$(stat -c%s pr.diff)
          echo "diff_size=$size" >> $GITHUB_OUTPUT
          if [ "$size" -gt 100000 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Diff too large ($size bytes), skipping classification"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Classify PR
        if: steps.size_check.outputs.skip != 'true'
        id: classify
        run: >
          opencode run
          --model opencode-go/deepseek-v4-flash
          "Classify this PR diff. Respond with only valid JSON matching the schema in the attached file. No markdown, no commentary."
          -f pr.diff
          -f .github/prompts/pr-classify.txt
          > opencode_output.json
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"*":"deny"},
            "mcp":{},
            "tools":{"bash":false,"edit":false,"write":false,"patch":false,
            "read":false,"glob":false,"grep":false,"list":false,
            "webfetch":false,"websearch":false,"task":false,"skill":false}}

      - name: Apply labels
        if: steps.size_check.outputs.skip != 'true'
        run: python3 .github/scripts/apply-pr-labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENCODE_OUTPUT: opencode_output.json
